# Build the macOS package on demand. GitHub Releases are published separately.
name: Build release package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build Proteus
        run: ./scripts/build-app.sh
      - name: Package
        run: cd build && ditto -c -k --sequesterRsrc --keepParent Proteus.app Proteus-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Proteus-mac
          path: build/Proteus-mac.zip
